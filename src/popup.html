<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myFastM Product Selection Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand-group">
        <img class="brand-logo" src="icons/icon48.png" alt="Logo">
        <span class="brand-name">myFastM Workspace</span>
      </div>
      <button class="btn btn-export" id="exportBtn" data-i18n="exportCSV">Export CSV</button>
    </header>

    <main class="popup-main">
      <div class="watchlist-section">
        <div class="section-title">
          <span data-i18n="savedProducts">Saved Products</span> 
          <span class="badge" id="watchlistCount">0</span>
        </div>
        <div class="watchlist-list" id="watchlistList">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
