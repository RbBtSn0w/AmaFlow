<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myFastM Product Selection Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand-group">
        <img class="brand-logo" src="icons/icon48.png" alt="Logo">
        <span class="brand-name">myFastM Workspace</span>
      </div>
      <button class="btn btn-export" id="exportBtn" data-i18n="exportCSV">Export CSV</button>
    </header>

    <main class="popup-main">
      <div class="watchlist-section">
        <div class="section-title">
          <span data-i18n="savedProducts">Saved Products</span> 
          <span class="badge" id="watchlistCount">0</span>
        </div>
        <div class="sort-bar" id="sortBar" style="display: none;">
          <span data-i18n="sortBy">Sort By:</span>
          <button class="sort-btn active" id="sortSalesBtn" data-type="sales" data-order="desc">
            <span data-i18n="sortBySales">Sales</span> <span class="sort-icon">↓</span>
          </button>
          <button class="sort-btn" id="sortPriceBtn" data-type="price" data-order="none">
            <span data-i18n="sortByPrice">Price</span> <span class="sort-icon"></span>
          </button>
          <button class="sort-btn" id="sortRatingBtn" data-type="rating" data-order="none">
            <span data-i18n="rating">Rating</span> <span class="sort-icon"></span>
          </button>
          <button class="sort-btn" id="sortReviewsBtn" data-type="reviews" data-order="none">
            <span data-i18n="reviews">Reviews</span> <span class="sort-icon"></span>
          </button>
        </div>
        <div class="watchlist-list" id="watchlistList">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
